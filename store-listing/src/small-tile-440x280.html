<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 440px;
        height: 280px;
      }
      body {
        position: relative;
        overflow: hidden;
        font-family:
          -apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif;
        color: #fff;
        background:
          radial-gradient(
            120% 90% at 10% -20%,
            rgba(120, 165, 255, 0.55) 0%,
            rgba(120, 165, 255, 0) 55%
          ),
          linear-gradient(135deg, #2f62d9 0%, #1f4dbe 45%, #163a99 100%);
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.14) 1.2px,
          transparent 1.2px
        );
        background-size: 20px 20px;
        opacity: 0.5;
      }
      .wrap {
        position: relative;
        height: 100%;
        display: flex;
        padding: 22px 20px;
        gap: 16px;
      }
      .left {
        width: 176px;
        flex-shrink: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .badge {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(9, 32, 84, 0.28);
        flex-shrink: 0;
      }
      .badge svg {
        width: 15px;
        height: 15px;
      }
      .brand span {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 18px;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.015em;
      }
      .bullets {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .bullet {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        font-weight: 600;
      }
      .bullet-icon {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 10.5px;
      }
      .panel {
        flex: 1;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 16px 34px rgba(8, 25, 70, 0.32);
        padding: 13px 14px;
        color: #1c2b4a;
      }
      .panel-title {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 700;
      }
      .rows {
        margin-top: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid #eef1f7;
      }
      .row-country {
        font-size: 10.5px;
        font-weight: 600;
      }
      .row-was {
        font-size: 8.5px;
        color: #9aa3b5;
      }
      .row-price {
        text-align: right;
        font-size: 10.5px;
        font-weight: 700;
      }
      .row-pct {
        font-size: 8.5px;
        font-weight: 700;
        color: #d84343;
      }
      .fill-btn {
        margin-top: 9px;
        text-align: center;
        background: #2f62d9;
        color: #fff;
        font-weight: 700;
        font-size: 10.5px;
        padding: 8px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="wrap">
      <div class="left">
        <div class="brand">
          <div class="badge">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#1f4dbe"
              stroke-width="3.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 12.5 L9.5 18 L20 6.5" />
            </svg>
          </div>
          <span>ConsoleTurbo</span>
        </div>
        <h1>Reply &amp; price faster, from the keyboard</h1>
        <div class="bullets">
          <div class="bullet">
            <div class="bullet-icon">&#9889;</div>
            &#8984;+Enter to publish
          </div>
          <div class="bullet">
            <div class="bullet-icon">&#127760;</div>
            PPP price 200+ markets
          </div>
          <div class="bullet">
            <div class="bullet-icon">&#128203;</div>
            Copy review as JSON
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">&#127760; PPP pricing</div>
        <div class="rows">
          <div class="row">
            <div>
              <div class="row-country">Albania</div>
              <div class="row-was">was USD 47.99</div>
            </div>
            <div>
              <div class="row-price">USD 16.99</div>
              <div class="row-pct">&darr; 65%</div>
            </div>
          </div>
          <div class="row">
            <div>
              <div class="row-country">Angola</div>
              <div class="row-was">was USD 39.99</div>
            </div>
            <div>
              <div class="row-price">USD 13.99</div>
              <div class="row-pct">&darr; 65%</div>
            </div>
          </div>
          <div class="row" style="border-bottom: none">
            <div>
              <div class="row-country">Australia</div>
              <div class="row-was">was AUD 62.99</div>
            </div>
            <div>
              <div class="row-price">AUD 55.99</div>
              <div class="row-pct">&darr; 11%</div>
            </div>
          </div>
        </div>
        <div class="fill-btn">Fill prices</div>
      </div>
    </div>
  </body>
</html>
